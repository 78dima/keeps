name: MonoKeep Android APK
on:
  push:
    branches: ['codex/android-apk']
    paths:
      - 'apps/android/**'
      - '!apps/android/**/*.md'
      - 'apps/web/**'
      - 'supabase/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Debug APK or release signed with repository secrets'
        type: choice
        options: [debug, release]
        default: debug
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@monokeep/shared
      - run: node --experimental-strip-types --test apps/web/tests/*.test.mjs
      - run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Web production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://lhjbeaaglpimzkfgrqdp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'build-only-placeholder' }}
        run: npm run build --workspace=@monokeep/web
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Reuse the test signing key, so subsequent debug APKs can update in place.
      # Production releases use the separately managed repository signing secrets below.
      - uses: actions/cache@v4
        with:
          path: apps/android/.toolchain/monokeep-debug.keystore
          key: monokeep-debug-signing-v2
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired SDK package "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Free space for Android emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Restore release signing key
        if: inputs.mode == 'release'
        env:
          KEYSTORE: ${{ secrets.MONOKEEP_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.MONOKEEP_KEY_PROPERTIES_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          if not os.environ['KEYSTORE'] or not os.environ['KEY_PROPERTIES']:
              raise SystemExit('Release needs MONOKEEP_KEYSTORE_BASE64 and MONOKEEP_KEY_PROPERTIES_BASE64 secrets. See apps/android/README.md.')
          os.umask(0o077)
          pathlib.Path('.toolchain').mkdir(exist_ok=True)
          pathlib.Path('.toolchain/monokeep-release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          pathlib.Path('android/key.properties').write_bytes(base64.b64decode(os.environ['KEY_PROPERTIES'], validate=True))
          PY
      - name: Analyze, test, build and verify APK signature
        env:
          MONOKEEP_BUILD_MODE: ${{ inputs.mode || 'debug' }}
        run: ./tools/build_apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monokeep-android-${{ inputs.mode || 'debug' }}
          path: |
            apps/android/dist/*.apk
            apps/android/dist/*.sha256
          if-no-files-found: error

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real SQLite migrations and offline sync on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          working-directory: apps/android/android
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            cd .. && flutter test integration_test/app_test.dart -d emulator-5554
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: apps/android/build/app/reports/androidTests/
