plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingFile = rootProject.file('key.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.monokeep.app'
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.monokeep.app'
        minSdk 23
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('../.toolchain/monokeep-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'JKS'
        }
        if (signingFile.exists()) {
            release {
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                storeType signing.getProperty('storeType', 'JKS')
            }
        }
    }
    buildTypes {
        release {
            // A release build must use a persistent private key; never silently use the debug key.
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}
flutter { source '../..' }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.google.guava:guava:33.4.0-android'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    testImplementation 'junit:junit:4.13.2'
    // Flutter integration_test brings an older runner into debugRuntimeClasspath.
    // Align both classpaths for AGP's consistent dependency resolution.
    debugImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
